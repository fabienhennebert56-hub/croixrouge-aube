<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logistique - Croix-Rouge (MOT)</title>
    <!-- Inclusion de QRCode.js pour générer les QR codes -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --cr-red: #cc0000;
            --cr-dark-bg: #121212;
            --cr-panel-bg: #1e1e1e;
            --cr-border: #333333;
            --cr-text: #e0e0e0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--cr-dark-bg); color: var(--cr-text); padding: 15px; }

        .panel { background: var(--cr-panel-bg); border: 1px solid var(--cr-border); border-radius: 8px; padding: 15px; margin-bottom: 15px; }
        header { border-bottom: 3px solid var(--cr-red); padding-bottom: 10px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        header h1 { color: #fff; font-size: 1.3rem; }

        .admin-status { display: flex; align-items: center; gap: 8px; font-size: 0.8rem; flex-wrap: wrap; }
        .badge-mode { padding: 4px 8px; border-radius: 12px; font-weight: bold; }
        .mode-normal { background: #333; color: #aaa; }
        .mode-admin { background: #1b5e20; color: #81c784; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 10px 8px; text-align: left; border-bottom: 1px solid var(--cr-border); font-size: 0.85rem; }
        th { background: #181818; color: #aaa; text-transform: uppercase; font-size: 0.7rem; }

        tr.row-expired { background-color: rgba(183, 28, 28, 0.25) !important; }

        .btn { padding: 8px 14px; background-color: var(--cr-red); color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 0.85rem; }
        .btn-small { padding: 6px 10px; font-size: 0.75rem; margin: 2px 0; }
        .btn-secondary { background: #333; color: #ccc; }
        .btn-edit { background: #1976d2; color: white; }
        .btn-duplicate { background: #00897b; color: white; }
        .btn-admin { background: #e65100; color: white; }
        .btn-pwd { background: #512da8; color: white; }

        .badge { padding: 3px 6px; border-radius: 10px; font-size: 0.7rem; font-weight: bold; display: inline-block; }
        .badge-ok { background: #1b5e20; color: #81c784; }
        .badge-warn { background: #e65100; color: #ffcc80; }
        .badge-alert { background: #b71c1c; color: #ef9a9a; }
        .badge-secondary { background: #2a2a2a; color: #888; }
        
        .form-inline { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; align-items: stretch; }
        input[type="text"], input[type="date"], input[type="number"], input[type="password"] { padding: 8px; background: #121212; border: 1px solid var(--cr-border); color: #fff; border-radius: 4px; font-size: 0.9rem; width: 100%; }
        .form-inline input { flex: 1; min-width: 120px; }
        
        .checkbox-container { display: flex; align-items: center; gap: 6px; background: #181818; padding: 8px 10px; border: 1px solid var(--cr-border); border-radius: 4px; cursor: pointer; color: #ccc; font-size: 0.8rem; width: 100%; }
        .checkbox-container input { cursor: pointer; width: 16px; height: 16px; }

        #qrcode-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; z-index: 1000; padding: 15px; }
        .modal-content { background: var(--cr-panel-bg); padding: 20px; border-radius: 8px; text-align: center; border: 1px solid var(--cr-border); max-width: 350px; width: 100%; }
        #qrcode-container { background: white; padding: 15px; display: inline-block; border-radius: 6px; margin: 15px 0; }

        @media screen and (max-width: 768px) {
            body { padding: 8px; }
            header { flex-direction: column; align-items: flex-start; }
            .admin-status { width: 100%; justify-content: space-between; margin-top: 5px; }

            table, thead, tbody, th, td, tr { display: block; }
            thead { display: none; }
            
            #containers-table tr, #items-table tr {
                background: #161616; border: 1px solid var(--cr-border); border-radius: 6px; margin-bottom: 12px; padding: 12px;
            }

            #containers-table td, #items-table td {
                border: none; padding: 5px 0; text-align: left; display: flex; justify-content: space-between; align-items: center; font-size: 0.9rem;
            }

            #containers-table td:nth-child(1):before { content: "Lot :"; color: #888; font-size: 0.8rem; font-weight: bold; }
            #containers-table td:nth-child(2):before { content: "Encoche :"; color: #888; font-size: 0.8rem; font-weight: bold; }
            #containers-table td:nth-child(3):before { content: "Péremption :"; color: #888; font-size: 0.8rem; font-weight: bold; }
            #containers-table td:nth-child(4):before { content: "Validation :"; color: #888; font-size: 0.8rem; font-weight: bold; }
            #containers-table td:nth-child(5) {
                border-top: 1px solid #2a2a2a; margin-top: 8px; padding-top: 10px; display: flex; flex-wrap: wrap; gap: 5px; justify-content: flex-end;
            }

            #items-table td:nth-child(1):before { content: "Article :"; color: #888; font-size: 0.8rem; font-weight: bold; }
            #items-table td:nth-child(2):before { content: "Quantité :"; color: #888; font-size: 0.8rem; font-weight: bold; }
            #items-table td:nth-child(3):before { content: "Péremption :"; color: #888; font-size: 0.8rem; font-weight: bold; }
            #items-table td:nth-child(4) {
                border-top: 1px solid #2a2a2a; margin-top: 8px; padding-top: 10px; display: flex; flex-wrap: wrap; gap: 5px; justify-content: flex-end;
            }

            .form-inline { flex-direction: column; }
            .form-inline input, .form-inline button, .checkbox-container { width: 100%; }
            .btn-small { width: 100%; text-align: center; padding: 8px; margin: 2px 0; }
            #containers-table td:nth-child(5) .btn-small, #items-table td:nth-child(4) .btn-small { width: auto; flex: 1; min-width: 45%; }
        }
    </style>
</head>
<body>

<header>
    <h1>Logistique (MOT)</h1>
    <div class="admin-status">
        <span id="mode-badge" class="badge-mode mode-normal">Mode : Consultation</span>
        <div style="display: flex; gap: 5px;">
            <button id="admin-toggle-btn" class="btn btn-small btn-admin" onclick="toggleAdminMode()">Admin</button>
            <button id="change-pwd-btn" class="btn btn-small btn-pwd" style="display: none;" onclick="changeAdminPassword()">🔑 Mdp</button>
        </div>
    </div>
</header>

<div id="add-lot-panel" class="panel" style="display: none;">
    <h3>Ajouter un Lot / Conteneur</h3>
    <div class="form-inline">
        <input type="text" id="new-lot-name" placeholder="Nom du lot">
        <input type="text" id="new-lot-encoche" placeholder="Encoche (ex: E1)">
        <button class="btn" onclick="addNewLot()">+ Créer le lot</button>
    </div>
</div>

<div class="panel">
    <h3>Conteneurs & Lots enregistrés</h3>
    <table id="containers-table">
        <thead>
            <tr>
                <th>Nom du Lot</th>
                <th>Encoche</th>
                <th>Péremption</th>
                <th>Validation Physique</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="containers-body"></tbody>
    </table>
</div>

<div id="items-panel" class="panel" style="display: none;">
    <h3 id="items-title" style="font-size: 1.1rem; margin-bottom: 10px;">Articles dans le lot</h3>
    
    <div id="add-item-form" class="form-inline" style="background: #151515; padding: 10px; border-radius: 6px; border: 1px dashed var(--cr-border); display: none;">
        <input type="text" id="item-name" placeholder="Nom de l'article">
        <input type="number" id="item-qty" placeholder="Qté" min="1" value="1">
        <input type="date" id="item-expiry">
        <label class="checkbox-container">
            <input type="checkbox" id="item-no-expiry" onchange="toggleNoExpiryField()">
            <span>♾️ (sans péremption)</span>
        </label>
        <button class="btn" onclick="addItemToCurrentLot()">Ajouter</button>
    </div>

    <table id="items-table" style="margin-top: 15px;">
        <thead>
            <tr><th>Article</th><th>Quantité</th><th>Date Péremption / Type</th><th>Actions</th></tr>
        </thead>
        <tbody id="items-body"></tbody>
    </table>
    <button class="btn btn-secondary" onclick="closeItems()" style="margin-top: 15px; width: 100%;">Fermer la gestion du lot</button>
</div>

<div id="qrcode-modal">
    <div class="modal-content">
        <h3 id="qr-modal-title" style="margin-bottom: 10px; color: #fff; font-size: 1.1rem;">QR Code du lot</h3>
        <div id="qrcode-container"></div>
        <div style="margin-top: 15px; display: flex; gap: 10px; justify-content: center; flex-direction: column;">
            <button class="btn" onclick="downloadQRCode()">Télécharger</button>
            <button class="btn btn-secondary" onclick="closeQRCodeModal()">Fermer</button>
        </div>
    </div>
</div>

<script>
    const API_URL = "https://api.jsonbin.io/v3/b/6a81d9d1da38895dfeebb8b2";
    const API_KEY = "$2a$10$rvsRxq/Z7qxtzzobIJh3buDRx.5FOPWVBi.ubxnM4AXn.3eyig0Hq";

    let data = [];
    let currentContainerId = null;
    let isAdmin = false;
    let currentAdminPassword = localStorage.getItem('cr_admin_pwd') || "1234";

    async function loadData() {
        try {
            const response = await fetch(API_URL, {
                headers: { 'X-Master-Key': API_KEY }
            });
            if (response.ok) {
                const resData = await response.json();
                data = resData.record || resData;
                localStorage.setItem('cr_data_sync', JSON.stringify(data));
            } else {
                data = JSON.parse(localStorage.getItem('cr_data_sync') || '[]');
            }
        } catch (e) {
            console.warn("Mode hors-ligne, utilisation du cache local.", e);
            data = JSON.parse(localStorage.getItem('cr_data_sync') || '[]');
        }
        renderContainers();
    }

    async function saveToStorage() {
        localStorage.setItem('cr_data_sync', JSON.stringify(data));
        renderContainers();
        
        try {
            await fetch(API_URL, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Master-Key': API_KEY
                },
                body: JSON.stringify(data)
            });
        } catch (e) {
            console.error("Erreur de synchronisation cloud :", e);
        }
    }

    loadData();

    function toggleAdminMode() {
        if (!isAdmin) {
            const code = prompt("Entrez le code administrateur :");
            if (code === currentAdminPassword) {
                isAdmin = true;
                updateUIMode();
                alert("Mode Administrateur activé.");
            } else if (code !== null) {
                alert("Code incorrect.");
            }
        } else {
            isAdmin = false;
            updateUIMode();
            alert("Mode Administrateur désactivé.");
        }
    }

    function changeAdminPassword() {
        if (!isAdmin) return;
        const oldPwd = prompt("Entrez l'ancien mot de passe administrateur :");
        if (oldPwd === null) return;

        if (oldPwd !== currentAdminPassword) {
            alert("Ancien mot de passe incorrect.");
            return;
        }

        const newPwd = prompt("Entrez le nouveau mot de passe administrateur :");
        if (newPwd !== null && newPwd.trim() !== "") {
            const confirmPwd = prompt("Confirmez le nouveau mot de passe :");
            if (confirmPwd === newPwd) {
                currentAdminPassword = newPwd;
                localStorage.setItem('cr_admin_pwd', currentAdminPassword);
                alert("Mot de passe administrateur modifié avec succès !");
            } else {
                alert("Les mots de passe ne correspondent pas. Modification annulée.");
            }
        }
    }

    function updateUIMode() {
        const badge = document.getElementById('mode-badge');
        const btn = document.getElementById('admin-toggle-btn');
        const changePwdBtn = document.getElementById('change-pwd-btn');
        const addLotPanel = document.getElementById('add-lot-panel');
        const addItemForm = document.getElementById('add-item-form');

        if (isAdmin) {
            badge.textContent = "Mode : Admin";
            badge.className = "badge-mode mode-admin";
            btn.textContent = "Verrouiller";
            changePwdBtn.style.display = 'inline-block';
            addLotPanel.style.display = 'block';
            addItemForm.style.display = 'flex';
        } else {
            badge.textContent = "Mode : Consultation";
            badge.className = "badge-mode mode-normal";
            btn.textContent = "Admin";
            changePwdBtn.style.display = 'none';
            addLotPanel.style.display = 'none';
            addItemForm.style.display = 'none';
        }
        renderContainers();
        if (currentContainerId !== null) renderItems();
    }

    function toggleNoExpiryField() {
        const noExpiry = document.getElementById('item-no-expiry').checked;
        const expiryInput = document.getElementById('item-expiry');
        expiryInput.disabled = noExpiry;
        expiryInput.style.opacity = noExpiry ? '0.3' : '1';
    }

    function parseExpiryDate(expiryStr) {
        if (!expiryStr) return null;
        if (expiryStr.includes('-')) return new Date(expiryStr + 'T00:00:00');
        if (expiryStr.includes('/')) {
            const parts = expiryStr.split('/');
            if (parts.length === 3) return new Date(`${parts[2]}-${parts[1]}-${parts[0]}T00:00:00`);
        }
        return new Date(expiryStr);
    }

    function getLotStatus(items) {
        if (!items || items.length === 0) return { class: 'badge-secondary', text: 'Vide' };
        
        const now = new Date();
        now.setHours(0, 0, 0, 0);
        
        let worst = 0; 
        items.forEach(i => {
            if (i.noExpiry || i.isElectronic) return; 
            const exp = parseExpiryDate(i.expiry);
            if (!exp || isNaN(exp)) return;
            const diff = (exp - now) / (1000 * 60 * 60 * 24);
            if (diff < 0) worst = 2;
            else if (diff < 90 && worst < 1) worst = 1;
        });
        if (worst === 2) return { class: 'badge-alert', text: 'Périmé !' };
        if (worst === 1) return { class: 'badge-warn', text: 'À surveiller' };
        return { class: 'badge-ok', text: 'Conforme' };
    }

    function renderContainers() {
        const tbody = document.getElementById('containers-body');
        if (!tbody) return;
        if (data.length === 0) { tbody.innerHTML = `<tr><td colspan="5" style="text-align:center;">Aucun lot.</td></tr>`; return; }

        tbody.innerHTML = data.map(c => {
            const status = getLotStatus(c.items);
            let adminActions = '';
            let qrCodeBtn = `<button class="btn btn-small btn-secondary" onclick="showQRCode(${c.id})">QR Code</button>`;
            
            if (isAdmin) {
                adminActions = `
                    <button class="btn btn-small btn-edit" onclick="renameLot(${c.id})">Renommer</button>
                    <button class="btn btn-small btn-duplicate" onclick="duplicateLot(${c.id})">Dupliquer</button>
                    <button class="btn btn-small" style="background:#800;" onclick="deleteLot(${c.id})">X</button>
                `;
            }

            return `<tr>
                <td><strong>${c.name}</strong></td>
                <td>${c.encoche || '-'}</td>
                <td><span class="badge ${status.class}">${status.text}</span></td>
                <td>
                    ${c.lastChecked ? '✅ ' + c.lastChecked : '❌'}
                    <button class="btn btn-small btn-secondary" onclick="toggleCheck(${c.id})">${c.lastChecked ? 'Dévalider' : 'Valider'}</button>
                </td>
                <td>
                    ${qrCodeBtn}
                    <button class="btn btn-small" onclick="viewItems(${c.id})">Articles</button>
                    ${adminActions}
                </td>
            </tr>`;
        }).join('');
    }

    function renderItems() {
        const c = data.find(x => x.id === currentContainerId);
        const tbody = document.getElementById('items-body');
        if (!c || !tbody) return;

        if (!c.items || c.items.length === 0) {
            tbody.innerHTML = `<tr><td colspan="4" style="text-align:center;">Aucun article dans ce lot.</td></tr>`;
            return;
        }

        const now = new Date();
        now.setHours(0, 0, 0, 0);

        tbody.innerHTML = c.items.map((item, idx) => {
            let expiryDisplay = '♾️ Sans péremption';
            let isExpired = false;

            if (!item.noExpiry && item.expiry) {
                const expDate = parseExpiryDate(item.expiry);
                if (expDate && !isNaN(expDate)) {
                    const diffDays = Math.ceil((expDate - now) / (1000 * 60 * 60 * 24));
                    if (diffDays < 0) {
                        expiryDisplay = `Périmé le ${item.expiry}`;
                        isExpired = true;
                    } else if (diffDays <= 90) {
                        expiryDisplay = `Expire le ${item.expiry} (Bientôt)`;
                    } else {
                        expiryDisplay = item.expiry;
                    }
                } else {
                    expiryDisplay = item.expiry;
                }
            }

            let adminItemActions = '';
            if (isAdmin) {
                adminItemActions = `
                    <button class="btn btn-small btn-edit" onclick="editItemExpiry(${idx})">Date</button>
                    <button class="btn btn-small btn-duplicate" onclick="duplicateItem(${idx})">Dupliquer</button>
                    <button class="btn btn-small" style="background:#800;" onclick="deleteItem(${idx})">X</button>
                `;
            }

            return `<tr class="${isExpired ? 'row-expired' : ''}">
                <td><strong>${item.name}</strong></td>
                <td>${item.qty}</td>
                <td>${expiryDisplay}</td>
                <td>${adminItemActions}</td>
            </tr>`;
        }).join('');
    }

    function addNewLot() {
        if (!isAdmin) return;
        const nameInput = document.getElementById('new-lot-name');
        const encocheInput = document.getElementById('new-lot-encoche');
        if (!nameInput.value.trim()) { alert("Nom requis."); return; }
        data.push({ id: Date.now(), name: nameInput.value.trim(), encoche: encocheInput.value.trim(), items: [], lastChecked: null });
        nameInput.value = ''; encocheInput.value = '';
        saveToStorage();
    }

    function renameLot(id) {
        if (!isAdmin) return;
        const c = data.find(x => x.id === id);
        const newName = prompt("Nouveau nom du lot :", c.name);
        const newEncoche = prompt("Nouvelle encoche :", c.encoche || '');
        if (newName !== null) {
            c.name = newName.trim();
            c.encoche = newEncoche.trim();
            saveToStorage();
        }
    }

    function duplicateLot(id) {
        if (!isAdmin) return;
        const c = data.find(x => x.id === id);
        const newName = prompt("Nom du nouveau lot dupliqué :", c.name + " (Copie)");
        if (newName !== null && newName.trim() !== "") {
            const duplicatedItems = JSON.parse(JSON.stringify(c.items));
            data.push({
                id: Date.now(),
                name: newName.trim(),
                encoche: c.encoche || '',
                items: duplicatedItems,
                lastChecked: null
            });
            saveToStorage();
        }
    }

    function toggleCheck(id) {
        const c = data.find(x => x.id === id);
        if (c) {
            c.lastChecked = c.lastChecked ? null : new Date().toLocaleDateString('fr-FR');
            saveToStorage();
        }
    }

    function deleteLot(id) {
        if (!isAdmin) return;
        if (confirm("Supprimer ce lot ?")) {
            data = data.filter(x => x.id !== id);
            saveToStorage();
            if (currentContainerId === id) closeItems();
        }
    }

    function viewItems(id) {
        currentContainerId = id;
        const c = data.find(x => x.id === id);
        document.getElementById('items-panel').style.display = 'block';
        document.getElementById('items-title').textContent = "Articles : " + c.name + " (" + (c.encoche || "Sans encoche") + ")";
        renderItems();
        document.getElementById('items-panel').scrollIntoView({ behavior: 'smooth' });
    }

    function closeItems() {
        currentContainerId = null;
        document.getElementById('items-panel').style.display = 'none';
    }

    function addItemToCurrentLot() {
        if (!isAdmin) return;
        const c = data.find(x => x.id === currentContainerId);
        if (!c) return;

        const name = document.getElementById('item-name').value.trim();
        const qty = parseInt(document.getElementById('item-qty').value) || 1;
        const noExpiry = document.getElementById('item-no-expiry').checked;
        const expiry = document.getElementById('item-expiry').value;

        if (!name) { alert("Nom de l'article requis."); return; }

        if (!c.items) c.items = [];
        c.items.push({
            name: name,
            qty: qty,
            expiry: noExpiry ? null : (expiry || null),
            noExpiry: noExpiry
        });

        document.getElementById('item-name').value = '';
        document.getElementById('item-qty').value = '1';
        document.getElementById('item-expiry').value = '';
        document.getElementById('item-no-expiry').checked = false;
        toggleNoExpiryField();

        saveToStorage();
        renderItems();
    }

    function editItemExpiry(idx) {
        if (!isAdmin) return;
        const c = data.find(x => x.id === currentContainerId);
        if (!c || !c.items[idx]) return;

        const item = c.items[idx];
        const newDate = prompt("Modifier la date de péremption (AAAA-MM-JJ) :", item.expiry || "");
        if (newDate !== null) {
            item.expiry = newDate.trim() || null;
            if (newDate.trim() !== "") item.noExpiry = false;
            saveToStorage();
            renderItems();
        }
    }

    function duplicateItem(idx) {
        if (!isAdmin) return;
        const c = data.find(x => x.id === currentContainerId);
        if (!c || !c.items[idx]) return;

        const itemToCopy = c.items[idx];
        c.items.push(JSON.parse(JSON.stringify(itemToCopy)));
        saveToStorage();
        renderItems();
    }

    function deleteItem(idx) {
        if (!isAdmin) return;
        const c = data.find(x => x.id === currentContainerId);
        if (!c || !c.items[idx]) return;

        if (confirm("Supprimer cet article ?")) {
            c.items.splice(idx, 1);
            saveToStorage();
            renderItems();
        }
    }

    let qrCodeInstance = null;
    function showQRCode(id) {
        const c = data.find(x => x.id === id);
        if (!c) return;

        document.getElementById('qr-modal-title').textContent = "QR Code : " + c.name;
        const container = document.getElementById('qrcode-container');
        container.innerHTML = "";

        qrCodeInstance = new QRCode(container, {
            text: window.location.href.split('?')[0] + "?lot=" + c.id,
            width: 200,
            height: 200
        });

        document.getElementById('qrcode-modal').style.display = 'flex';
    }

    function closeQRCodeModal() {
        document.getElementById('qrcode-modal').style.display = 'none';
    }

    function downloadQRCode() {
        const img = document.querySelector('#qrcode-container img');
        if (img) {
            const link = document.createElement('a');
            link.href = img.src;
            link.download = 'qrcode_lot.png';
            link.click();
        }
    }
</script>

</body>
</html>
