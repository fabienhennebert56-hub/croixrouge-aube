<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logistique - Croix-Rouge (MAT)</title>
    <style>
        :root {
            --cr-red: #cc0000;
            --cr-dark-red: #990000;
            --cr-dark-bg: #121212;
            --cr-panel-bg: #1e1e1e;
            --cr-border: #333333;
            --cr-text: #e0e0e0;
            --cr-text-muted: #888888;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--cr-dark-bg); color: var(--cr-text); padding: 20px; }

        .panel { background: var(--cr-panel-bg); border: 1px solid var(--cr-border); border-radius: 8px; padding: 20px; margin-bottom: 20px; }
        header { border-bottom: 3px solid var(--cr-red); padding-bottom: 10px; margin-bottom: 20px; }
        header h1 { color: #fff; font-size: 1.5rem; }

        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid var(--cr-border); font-size: 0.9rem; }
        th { background: #181818; color: #aaa; text-transform: uppercase; font-size: 0.75rem; }

        .btn { padding: 8px 16px; background-color: var(--cr-red); color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-small { padding: 5px 10px; font-size: 0.8rem; }
        .btn-secondary { background: #333; color: #ccc; }

        .badge { padding: 4px 8px; border-radius: 12px; font-size: 0.75rem; font-weight: bold; }
        .badge-ok { background: #1b5e20; color: #81c784; }
        .badge-warn { background: #e65100; color: #ffcc80; }
        .badge-alert { background: #b71c1c; color: #ef9a9a; }
        .badge-secondary { background: #2a2a2a; color: #888; }
        
        .form-inline { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        input { padding: 8px; background: #121212; border: 1px solid var(--cr-border); color: #fff; border-radius: 4px; }
    </style>
</head>
<body>

<header>
    <h1>Gestion Logistique (MAT)</h1>
    <div id="sync-status" style="font-size: 0.8rem; color: var(--cr-text-muted);">Initialisation...</div>
</header>

<div class="panel">
    <div style="display: flex; justify-content: space-between; align-items: center;">
        <h3>Conteneurs & Lots</h3>
        <button class="btn" onclick="addContainer()">+ Ajouter un Lot</button>
    </div>
    <table id="containers-table">
        <thead>
            <tr>
                <th>Nom du Lot</th>
                <th>Péremption</th>
                <th>Validation Physique</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="containers-body"></tbody>
    </table>
</div>

<div id="items-panel" class="panel" style="display: none;">
    <h3 id="items-title">Articles dans le lot</h3>
    <div class="form-inline">
        <input type="text" id="item-name" placeholder="Nom article">
        <input type="date" id="item-expiry">
        <button class="btn" onclick="addItem()">Ajouter Article</button>
    </div>
    <table id="items-table">
        <thead>
            <tr>
                <th>Article</th>
                <th>Date Péremption</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="items-body"></tbody>
    </table>
    <button class="btn btn-secondary" onclick="closeItems()" style="margin-top: 15px;">Fermer</button>
</div>

<script>
    const BIN_ID = "665f839fe41b4d34e4053f3e";
    const API_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;
    const API_KEY = '$2a$10$wU0u/L4y9N/yv5L.9.9sSe5gYJ9j.T4.g7.5u3QpG1zXz9t.9nZJ.';

    let data = JSON.parse(localStorage.getItem('cr_data') || '[]');
    let currentContainerId = null;

    async function fetchData() {
        try {
            const response = await fetch(API_URL, { headers: { 'X-Master-Key': API_KEY } });
            const json = await response.json();
            data = json.record;
            render();
            document.getElementById('sync-status').textContent = "✔ À jour (Cloud)";
        } catch (e) {
            document.getElementById('sync-status').textContent = "⚠ Hors-ligne (Local)";
        }
    }

    async function save() {
        localStorage.setItem('cr_data', JSON.stringify(data));
        render();
        try {
            await fetch(API_URL, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json', 'X-Master-Key': API_KEY },
                body: JSON.stringify(data)
            });
        } catch (e) {}
    }

    function getLotStatus(items) {
        if (!items || items.length === 0) return { class: 'badge-secondary', text: 'Vide' };
        const now = new Date();
        let worst = 0; // 0: OK, 1: Warn, 2: Alert
        items.forEach(i => {
            const exp = new Date(i.expiry);
            const diff = (exp - now) / (1000 * 60 * 60 * 24);
            if (diff < 0) worst = 2;
            else if (diff < 90 && worst < 1) worst = 1;
        });
        if (worst === 2) return { class: 'badge-alert', text: 'Périmé !' };
        if (worst === 1) return { class: 'badge-warn', text: 'À surveiller' };
        return { class: 'badge-ok', text: 'Conforme' };
    }

    function render() {
        const tbody = document.getElementById('containers-body');
        tbody.innerHTML = data.map(c => {
            const status = getLotStatus(c.items);
            return `<tr>
                <td><strong>${c.name}</strong></td>
                <td><span class="badge ${status.class}">${status.text}</span></td>
                <td>
                    ${c.lastChecked ? '✅ ' + c.lastChecked : '❌ Non vérifié'}
                    <button class="btn btn-small btn-secondary" style="margin-left:10px;" onclick="toggleCheck(${c.id})">${c.lastChecked ? 'Dévalider' : 'Valider'}</button>
                </td>
                <td>
                    <button class="btn btn-small" onclick="viewItems(${c.id})">Gérer</button>
                    <button class="btn btn-small" style="background:#800;" onclick="deleteLot(${c.id})">Suppr</button>
                </td>
            </tr>`;
        }).join('');
    }

    function addContainer() {
        const name = prompt("Nom du nouveau lot :");
        if (name) {
            data.push({ id: Date.now(), name, items: [], lastChecked: null });
            save();
        }
    }

    function toggleCheck(id) {
        const c = data.find(x => x.id === id);
        c.lastChecked = c.lastChecked ? null : new Date().toLocaleString();
        save();
    }

    function viewItems(id) {
        currentContainerId = id;
        document.getElementById('items-panel').style.display = 'block';
        document.getElementById('items-title').textContent = "Articles du lot : " + data.find(c => c.id === id).name;
        renderItems();
    }

    function renderItems() {
        const c = data.find(x => x.id === currentContainerId);
        const tbody = document.getElementById('items-body');
        tbody.innerHTML = c.items.map((i, idx) => `<tr>
            <td>${i.name}</td>
            <td>${i.expiry}</td>
            <td><button class="btn btn-small" style="background:#800;" onclick="deleteItem(${idx})">X</button></td>
        </tr>`).join('');
    }

    function addItem() {
        const name = document.getElementById('item-name').value;
        const expiry = document.getElementById('item-expiry').value;
        if (!name || !expiry) return alert("Remplissez tout");
        data.find(c => c.id === currentContainerId).items.push({ name, expiry });
        document.getElementById('item-name').value = '';
        save();
        renderItems();
        render();
    }

    function deleteItem(idx) {
        data.find(c => c.id === currentContainerId).items.splice(idx, 1);
        save();
        renderItems();
        render();
    }

    function deleteLot(id) {
        if(confirm("Supprimer ?")) {
            data = data.filter(x => x.id !== id);
            save();
        }
    }

    function closeItems() { document.getElementById('items-panel').style.display = 'none'; }

    window.onload = fetchData;
</script>
</body>
</html>
