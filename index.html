<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Logistique Croix-Rouge</title>
    <style>
        body { font-family: sans-serif; background: #f4f4f4; padding: 20px; }
        .container { max-width: 900px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .section { margin-bottom: 20px; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
        input, select { padding: 8px; margin: 5px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 8px 15px; background: #cc0000; color: white; border: none; border-radius: 4px; cursor: pointer; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
    </style>
</head>
<body>

<div class="container">
    <h2>Logistique Croix-Rouge</h2>
    
    <!-- Sélection de la catégorie (votre organisation) -->
    <div class="section">
        <label>Emplacement :</label>
        <select id="category" onchange="renderView()">
            <option value="vehicule">Véhicule</option>
            <option value="reserve">Réserves</option>
        </select>
    </div>

    <!-- Zone d'ajout -->
    <div class="section">
        <input type="text" id="name" placeholder="Article">
        <input type="text" id="lot" placeholder="Lot">
        <input type="date" id="expiry">
        <button onclick="addItem()">Ajouter</button>
    </div>

    <table>
        <thead><tr><th>Article</th><th>Lot</th><th>Péremption</th><th>Action</th></tr></thead>
        <tbody id="list"></tbody>
    </table>
</div>

<script>
    // Chargement depuis le stockage local (synchronisé par le navigateur)
    function getData() {
        return JSON.parse(localStorage.getItem('logistique_data') || '{"vehicule":[], "reserve":[]}');
    }

    function renderView() {
        const cat = document.getElementById('category').value;
        const data = getData();
        const list = document.getElementById('list');
        list.innerHTML = '';
        
        data[cat].forEach((item, index) => {
            list.innerHTML += `<tr>
                <td>${item.name}</td><td>${item.lot}</td><td>${item.expiry}</td>
                <td><button onclick="deleteItem('${cat}', ${index})">Supprimer</button></td>
            </tr>`;
        });
    }

    function addItem() {
        const cat = document.getElementById('category').value;
        const name = document.getElementById('name').value;
        const lot = document.getElementById('lot').value;
        const expiry = document.getElementById('expiry').value;
        
        if(!name || !expiry) return alert("Remplissez le nom et la date !");

        const data = getData();
        data[cat].push({name, lot, expiry});
        localStorage.setItem('logistique_data', JSON.stringify(data));
        
        document.getElementById('name').value = '';
        document.getElementById('lot').value = '';
        document.getElementById('expiry').value = '';
        
        renderView();
    }

    function deleteItem(cat, index) {
        const data = getData();
        data[cat].splice(index, 1);
        localStorage.setItem('logistique_data', JSON.stringify(data));
        renderView();
    }

    renderView();
</script>
</body>
</html>
