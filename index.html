<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logistique - Croix-Rouge (MOT)</title>
    <style>
        :root {
            --cr-red: #cc0000;
            --cr-dark-bg: #121212;
            --cr-panel-bg: #1e1e1e;
            --cr-border: #333333;
            --cr-text: #e0e0e0;
            --cr-alert: #b71c1c; /* Rouge vif pour alertes */
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--cr-dark-bg); color: var(--cr-text); padding: 20px; }

        .panel { background: var(--cr-panel-bg); border: 1px solid var(--cr-border); border-radius: 8px; padding: 20px; margin-bottom: 20px; }
        header { border-bottom: 3px solid var(--cr-red); padding-bottom: 10px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        header h1 { color: #fff; font-size: 1.5rem; }

        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid var(--cr-border); font-size: 0.9rem; }
        th { background: #181818; color: #aaa; text-transform: uppercase; font-size: 0.75rem; }

        /* Classes pour les lignes de tableaux (alertes dates) */
        table tr.row-expired { background-color: rgba(183, 28, 28, 0.2); } /* Fond rouge très léger */

        .btn { padding: 8px 16px; background-color: var(--cr-red); color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-small { padding: 5px 10px; font-size: 0.8rem; margin: 2px; }
        .btn-secondary { background: #333; color: #ccc; }
        .btn-edit { background: #1976d2; color: white; }

        .badge { padding: 4px 8px; border-radius: 12px; font-size: 0.75rem; font-weight: bold; }
        .badge-ok { background: #1b5e20; color: #81c784; }
        .badge-warn { background: #e65100; color: #ffcc80; }
        .badge-alert { background: var(--cr-alert); color: #fff; } /* Utilisé pour le lot et l'article */
        .badge-secondary { background: #2a2a2a; color: #888; }
        
        .form-inline { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; align-items: center; }
        input[type="text"], input[type="date"], input[type="number"] { padding: 8px; background: #121212; border: 1px solid var(--cr-border); color: #fff; border-radius: 4px; }
        input[type="text"] { flex: 2; min-width: 150px; }
        input[type="number"] { width: 80px; }
        input[type="date"] { flex: 1; min-width: 130px; }
        
        .checkbox-container { display: flex; align-items: center; gap: 6px; background: #181818; padding: 8px 12px; border: 1px solid var(--cr-border); border-radius: 4px; cursor: pointer; color: #ccc; font-size: 0.85rem; }
        .checkbox-container input { cursor: pointer; width: 16px; height: 16px; }
    </style>
</head>
<body>

<header>
    <h1>Gestion Logistique (MOT)</h1>
    <div style="font-size: 0.8rem; color: #4caf50;">✔ Lots, Quantités, Matériel, Encoches & Alertes visuelles</div>
</header>

<div class="panel">
    <h3>Ajouter un Lot / Conteneur</h3>
    <div class="form-inline">
        <input type="text" id="new-lot-name" placeholder="Nom du lot">
        <input type="text" id="new-lot-encoche" placeholder="Encoche (ex: E1, A4)" style="width: 100px;">
        <button class="btn" onclick="addNewLot()">+ Créer le lot</button>
    </div>
</div>

<div class="panel">
    <h3>Conteneurs & Lots enregistrés</h3>
    <table id="containers-table">
        <thead>
            <tr>
                <th>Nom du Lot</th>
                <th>Encoche</th>
                <th>Péremption Globale</th>
                <th>Validation Physique</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="containers-body"></tbody>
    </table>
</div>

<div id="items-panel" class="panel" style="display: none;">
    <h3 id="items-title">Articles dans le lot</h3>
    <div class="form-inline" style="background: #151515; padding: 12px; border-radius: 6px; border: 1px dashed var(--cr-border);">
        <input type="text" id="item-name" placeholder="Nom de l'article">
        <input type="number" id="item-qty" placeholder="Qté" min="1" value="1">
        <input type="date" id="item-expiry">
        <label class="checkbox-container">
            <input type="checkbox" id="item-is-electronic" onchange="toggleExpiryField()">
            <span>🔋 Électronique</span>
        </label>
        <button class="btn" onclick="addItemToCurrentLot()">Ajouter</button>
    </div>

    <table id="items-table">
        <thead>
            <tr><th>Article</th><th>Quantité</th><th>Date Péremption / Type</th><th>Action</th></tr>
        </thead>
        <tbody id="items-body"></tbody>
    </table>
    <button class="btn btn-secondary" onclick="closeItems()" style="margin-top: 15px;">Fermer la gestion du lot</button>
</div>

<script>
    let data = JSON.parse(localStorage.getItem('cr_data_github') || '[]');
    let currentContainerId = null;

    // --- Utilitaires de dates ---
    function parseDate(dateStr) {
        return new Date(dateStr + 'T00:00:00'); // Force l'heure à minuit UTC pour éviter décalages fuseau
    }

    function isExpired(expiryStr) {
        if (!expiryStr) return false;
        const expiry = parseDate(expiryStr);
        const now = new Date();
        now.setHours(0, 0, 0, 0); // Aujourd'hui minuit
        return expiry < now;
    }

    function isSoonToExpire(expiryStr) {
        if (!expiryStr) return false;
        const expiry = parseDate(expiryStr);
        const now = new Date();
        now.setHours(0, 0, 0, 0);
        const diffTime = expiry - now;
        const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
        return diffDays > 0 && diffDays <= 90; // Entre 1 et 90 jours
    }
    // ---------------------------

    function saveToStorage() {
        localStorage.setItem('cr_data_github', JSON.stringify(data));
        renderContainers();
    }

    function toggleExpiryField() {
        const isElec = document.getElementById('item-is-electronic').checked;
        const expiryInput = document.getElementById('item-expiry');
        expiryInput.disabled = isElec;
        expiryInput.style.opacity = isElec ? '0.3' : '1';
        if (isElec) expiryInput.value = '';
    }

    function getLotStatus(items) {
        if (!items || items.length === 0) return { class: 'badge-secondary', text: 'Vide' };
        
        let worst = 0; // 0: OK, 1: Soon, 2: Expired
        items.forEach(i => {
            if (i.isElectronic) return; 
            if (isExpired(i.expiry)) worst = 2;
            else if (isSoonToExpire(i.expiry) && worst < 1) worst = 1;
        });
        
        if (worst === 2) return { class: 'badge-alert', text: 'Périmé ! (Un ou +)' };
        if (worst === 1) return { class: 'badge-warn', text: 'À surveiller' };
        return { class: 'badge-ok', text: 'Conforme' };
    }

    function renderContainers() {
        const tbody = document.getElementById('containers-body');
        if (!tbody) return;
        if (data.length === 0) { tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:#888;">Aucun lot.</td></tr>`; return; }

        tbody.innerHTML = data.map(c => {
            const status = getLotStatus(c.items);
            return `<tr>
                <td><strong>${c.name}</strong></td>
                <td>${c.encoche || '-'}</td>
                <td><span class="badge ${status.class}">${status.text}</span></td>
                <td>
                    ${c.lastChecked ? '✅ ' + c.lastChecked : '❌'}
                    <button class="btn btn-small btn-secondary" onclick="toggleCheck(${c.id})">${c.lastChecked ? 'Dévalider' : 'Valider'}</button>
                </td>
                <td>
                    <button class="btn btn-small btn-edit" onclick="renameLot(${c.id})">Renommer</button>
                    <button class="btn btn-small" onclick="viewItems(${c.id})">Articles</button>
                    <button class="btn btn-small" style="background:#800;" onclick="deleteLot(${c.id})">X</button>
                </td>
            </tr>`;
        }).join('');
    }

    function addNewLot() {
        const nameInput = document.getElementById('new-lot-name');
        const encocheInput = document.getElementById('new-lot-encoche');
        if (!nameInput.value.trim()) { alert("Veuillez entrer un nom de lot."); return; }
        data.push({ id: Date.now(), name: nameInput.value.trim(), encoche: encocheInput.value.trim(), items: [], lastChecked: null });
        nameInput.value = ''; encocheInput.value = '';
        saveToStorage();
    }

    function renameLot(id) {
        const c = data.find(x => x.id === id);
        const newName = prompt("Modifier le nom du lot :", c.name);
        if (newName === null) return;
        const newEncoche = prompt("Modifier l'encoche (ex: E1) :", c.encoche || '');
        if (newEncoche === null) return;

        c.name = newName.trim();
        c.encoche = newEncoche.trim();
        saveToStorage();
    }

    function toggleCheck(id) {
        const c = data.find(x => x.id === id);
        if (c) {
            c.lastChecked = c.lastChecked ? null : new Date().toLocaleDateString('fr-FR');
            saveToStorage();
        }
    }

    function deleteLot(id) {
        if (confirm("Voulez-vous vraiment supprimer ce lot et tout son contenu ?")) {
            data = data.filter(x => x.id !== id);
            saveToStorage();
            if (currentContainerId === id) closeItems();
        }
    }

    function viewItems(id) {
        currentContainerId = id;
        const c = data.find(x => x.id === id);
        document.getElementById('items-panel').style.display = 'block';
        document.getElementById('items-title').textContent = "Articles du lot : " + c.name + " (" + (c.encoche || "Sans encoche") + ")";
        renderItems();
        document.getElementById('items-panel').scrollIntoView({ behavior: 'smooth' });
    }

    function renderItems() {
        const c = data.find(x => x.id === currentContainerId);
        const tbody = document.getElementById('items-body');
        
        if (!c || !c.items || c.items.length === 0) {
            tbody.innerHTML = `<tr><td colspan="4" style="text-align:center; color:#888;">Aucun article dans ce lot.</td></tr>`;
            return;
        }

        // Optionnel : Trier par date de péremption (les plus proches en premier)
        c.items.sort((a, b) => {
            if (a.isElectronic && b.isElectronic) return 0;
            if (a.isElectronic) return 1;
            if (b.isElectronic) return -1;
            return new Date(a.expiry) - new Date(b.expiry);
        });

        tbody.innerHTML = c.items.map((i, idx) => {
            let expiryDisplay = '';
            let rowClass = '';
            
            if (i.isElectronic) {
                expiryDisplay = '🔋 Appareil électronique';
            } else {
                const expired = isExpired(i.expiry);
                const soon = isSoonToExpire(i.expiry);
                
                // Formatage de la date (JJ/MM/AAAA)
                const dateObj = parseDate(i.expiry);
                const formattedDate = dateObj.toLocaleDateString('fr-FR');

                if (expired) {
                    expiryDisplay = `<span style="color:#fff;">${formattedDate}</span> <span class="badge badge-alert" style="margin-left:5px;">PÉRIMÉ !</span>`;
                    rowClass = 'row-expired'; // Classe CSS définie dans <style>
                } else if (soon) {
                    expiryDisplay = `<span style="color:#ffcc80;">${formattedDate}</span> <span class="badge badge-warn" style="margin-left:5px;">À surveiller</span>`;
                } else {
                    expiryDisplay = formattedDate; // Date normale
                }
            }

            return `<tr class="${rowClass}">
                <td>${i.name}</td>
                <td><strong>${i.qty}</strong></td>
                <td>${expiryDisplay}</td>
                <td>
                    <button class="btn btn-small btn-edit" onclick="editItem(${idx})">Modifier</button>
                    <button class="btn btn-small" style="background:#800;" onclick="deleteItem(${idx})">X</button>
                </td>
            </tr>`;
        }).join('');
    }

    function addItemToCurrentLot() {
        const nameInput = document.getElementById('item-name');
        const qtyInput = document.getElementById('item-qty');
        const expiryInput = document.getElementById('item-expiry');
        const elecInput = document.getElementById('item-is-electronic');
        
        const name = nameInput.value.trim();
        const qty = parseInt(qtyInput.value);
        const isElectronic = elecInput.checked;
        const expiry = expiryInput.value;

        if (!name || isNaN(qty) || qty <= 0 || (!isElectronic && !expiry)) {
            alert("Veuillez remplir correctement le nom, la quantité et soit une date de péremption, soit cocher l'appareil électronique.");
            return;
        }

        const c = data.find(x => x.id === currentContainerId);
        if (c) {
            if (!c.items) c.items = [];
            c.items.push({ name, qty, expiry: isElectronic ? null : expiry, isElectronic });
