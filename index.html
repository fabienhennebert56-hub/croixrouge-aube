<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion Logistique Croix-Rouge</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root { --croixrouge: #d32f2f; }
        .bg-croixrouge-600 { background-color: var(--croixrouge); }
        .text-croixrouge-500 { color: var(--croixrouge); }
        .ring-croixrouge-500 { --tw-ring-color: var(--croixrouge); }
        body { background-color: #111827; }
    </style>
</head>
<body class="text-gray-100">

    <div id="app" class="max-w-4xl mx-auto p-4 pb-20">
        <!-- Header -->
        <header class="flex justify-between items-center mb-6">
            <div>
                <h1 class="text-2xl font-bold text-white">Inventaire Croix-Rouge</h1>
                <p class="text-xs text-gray-400">Gestion et suivi des équipements</p>
            </div>
            <div class="flex space-x-2 items-center">
                <button onclick="app.switchView('home')" class="bg-gray-800 hover:bg-gray-700 text-gray-200 px-3 py-2 rounded-xl text-xs transition">🏠 Accueil</button>
                <button onclick="app.switchView('reappro')" class="bg-croixrouge-600/80 hover:bg-croixrouge-600 text-white px-3 py-2 rounded-xl text-xs transition flex items-center space-x-1">
                    <span>⚠️ Réappro</span>
                </button>
                <button id="admin-toggle-btn" onclick="app.promptAdminLogin()" class="bg-gray-700 text-gray-200 px-3 py-2 rounded-xl text-xs transition">
                    🔒 Admin
                </button>
            </div>
        </header>

        <!-- Notification Banner -->
        <div id="notification-banner" class="hidden mb-6 p-4 rounded-xl text-sm font-medium shadow-sm transition"></div>

        <!-- Recherche globale -->
        <div id="global-search-container" class="relative mb-6">
            <input type="text" id="global-search-input" oninput="app.handleGlobalSearch(this.value)" placeholder="Rechercher un lot ou un article..." class="w-full bg-gray-800 border border-gray-700 rounded-2xl px-6 py-3 text-white focus:outline-none focus:ring-2 focus:ring-croixrouge-500 text-sm">
            <div id="global-search-dropdown" class="absolute z-10 w-full bg-gray-800 border border-gray-700 mt-2 rounded-xl hidden shadow-xl"></div>
        </div>

        <!-- Contenu dynamique -->
        <div id="main-content"></div>

        <!-- Outils Admin & Interrupteur Synchro Cloud -->
        <div id="admin-tools-footer" class="hidden mt-8 pt-6 border-t border-gray-800 flex flex-wrap gap-3 justify-between items-center">
            <div class="flex items-center space-x-2">
                <span id="connection-status-dot" class="w-2.5 h-2.5 rounded-full bg-emerald-500"></span>
                <span id="connection-status-text" class="text-xs text-gray-300 font-medium">Mode Connecté (Cloud actif)</span>
            </div>
            <div class="flex space-x-2">
                <button id="toggle-cloud-btn" onclick="app.toggleCloudMode()" class="px-3 py-1.5 bg-amber-600 hover:bg-amber-700 text-white text-xs rounded-xl transition font-medium">🔌 Se déconnecter (Mode Local)</button>
                <button onclick="app.exportData()" class="px-3 py-1.5 bg-gray-800 hover:bg-gray-700 border border-gray-700 text-xs rounded-xl transition">💾 Exporter JSON</button>
            </div>
        </div>
    </div>

    <!-- Modale -->
    <div id="modal-container" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center p-4 z-50">
        <div id="modal-box" class="bg-gray-800 rounded-2xl p-6 w-full max-w-lg border border-gray-700 shadow-2xl"></div>
    </div>

    <script>
    class LogisticsApp {
        constructor() {
            this.binId = "6a81d9d1da38895dfeebb8b2";
            this.apiKey = "$2a$10$rvsRxq/Z7qxtzzobIJh3buDRx.5FOPWVBi.ubxnM4AXn.3eyig0Hq";
            
            this.data = { categories: [] };
            this.isAdmin = false;
            this.isCloudConnected = true;
            this.currentView = 'home';
            this.selectedCatId = null;
            this.selectedLotId = null;
            this.searchFilterText = '';

            this.initData();
        }

        async initData() {
            await this.loadFromCloud();
            
            const urlParams = new URLSearchParams(window.location.search);
            const targetLot = urlParams.get('lot');
            if (targetLot) {
                this.findAndOpenLotById(targetLot);
            }

            this.render();
        }

        async loadFromCloud() {
            try {
                const response = await fetch(`https://api.jsonbin.io/v3/b/${this.binId}/latest`, {
                    headers: { 'X-Master-Key': this.apiKey }
                });
                if (response.ok) {
                    const resData = await response.json();
                    if (resData && resData.record) {
                        this.data = resData.record;
                        localStorage.setItem('croix_rouge_data', JSON.stringify(this.data));
                    }
                } else {
                    this.loadFallbackLocal();
                }
            } catch (err) {
                console.warn("Impossible de joindre le cloud, utilisation du cache local.", err);
                this.loadFallbackLocal();
            }
        }

        loadFallbackLocal() {
            const local = localStorage.getItem('croix_rouge_data');
            if (local) {
                this.data = JSON.parse(local);
            }
        }

        findAndOpenLotById(lotId) {
            for (let cat of this.data.categories) {
                if (cat.lots) {
                    let lot = cat.lots.find(l => l.id === lotId);
                    if (lot) {
                        this.selectedCatId = cat.id;
                        this.selectedLotId = lot.id;
                        this.currentView = 'lot';
                        break;
                    }
                }
            }
        }

        saveData() {
            localStorage.setItem('croix_rouge_data', JSON.stringify(this.data));
            if (this.isCloudConnected) {
                this.syncToCloudSilent();
            }
        }

        async syncToCloudSilent() {
            try {
                await fetch(`https://api.jsonbin.io/v3/b/${this.binId}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Key': this.apiKey
                    },
                    body: JSON.stringify(this.data)
                });
            } catch (err) {
                console.error("Erreur synchro cloud silencieuse", err);
            }
        }

        toggleCloudMode() {
            if (this.isCloudConnected) {
                this.isCloudConnected = false;
                this.showNotification("Déconnecté de JSONBin : modifications en local uniquement.", "info");
            } else {
                this.isCloudConnected = true;
                this.syncToCloudGlobal();
            }
            this.updateAdminUI();
        }

        async syncToCloudGlobal() {
            try {
                const response = await fetch(`https://api.jsonbin.io/v3/b/${this.binId}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Key': this.apiKey
                    },
                    body: JSON.stringify(this.data)
                });
                if (response.ok) {
                    this.showNotification("Reconnecté et synchronisation globale réussie !", "success");
                } else {
                    this.showNotification("Erreur lors de la reconnexion cloud.", "error");
                    this.isCloudConnected = false;
                }
            } catch (err) {
                console.error("Erreur réseau cloud", err);
                this.showNotification("Erreur réseau lors de la reconnexion.", "error");
                this.isCloudConnected = false;
            }
            this.updateAdminUI();
        }

        switchView(view) {
            this.currentView = view;
            if (view === 'home') {
                this.selectedCatId = null;
                this.selectedLotId = null;
                window.history.replaceState({}, document.title, window.location.pathname);
            }
            this.render();
        }

        render() {
            const container = document.getElementById('main-content');
            const searchContainer = document.getElementById('global-search-container');
            
            if (this.currentView === 'home') {
                searchContainer.classList.remove('hidden');
                container.innerHTML = this.renderHome();
            } else if (this.currentView === 'lot') {
                searchContainer.classList.add('hidden');
                container.innerHTML = this.renderLotView();
            } else if (this.currentView === 'reappro') {
                searchContainer.classList.add('hidden');
                container.innerHTML = this.renderReapproView();
            }
            this.updateAdminUI();
        }

        renderHome() {
            return `
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    ${this.data.categories.map(cat => `
                        <div class="bg-gray-800 p-5 rounded-2xl border border-gray-700 hover:border-croixrouge-600 transition">
                            <div class="flex justify-between items-center mb-4">
                                <h2 class="font-bold text-lg text-white">${cat.name}</h2>
                                ${this.isAdmin ? `<button onclick="app.deleteCategory('${cat.id}')" class="text-red-400 text-xs hover:text-red-300">Supprimer</button>` : ''}
                            </div>
                            <div class="space-y-2">
                                ${cat.lots && cat.lots.length > 0 ? cat.lots.map(lot => `
                                    <div class="w-full text-left bg-gray-900 p-3 rounded-xl flex justify-between items-center hover:bg-gray-700 transition">
                                        <button onclick="app.selectLot('${cat.id}', '${lot.id}')" class="flex-1 text-left">
                                            <span class="text-sm font-medium">${lot.name}</span>
                                            <span class="text-xs text-gray-400 block">${lot.articles ? lot.articles.length : 0} art.</span>
                                        </button>
                                        <button onclick="app.openQrModal('${lot.id}', '${lot.name}')" class="ml-2 px-2.5 py-1 bg-gray-800 hover:bg-gray-600 text-xs rounded-lg text-gray-200 transition">QR</button>
                                    </div>
                                `).join('') : `<p class="text-xs text-gray-500 italic py-1">Aucun lot dans cette catégorie.</p>`}
                            </div>
                            ${this.isAdmin ? `<button onclick="app.selectedCatId='${cat.id}'; app.openAddLotModal()" class="w-full mt-4 py-2 border border-dashed border-gray-600 rounded-xl text-xs text-gray-400 hover:border-croixrouge-500 hover:text-white transition">+ Ajouter un lot</button>` : ''}
                        </div>
                    `).join('')}
                </div>
                ${this.isAdmin ? `
                    <button onclick="app.openAddCategoryModal()" class="w-full mt-6 py-4 bg-gray-800 border-2 border-dashed border-gray-700 rounded-2xl text-sm text-gray-400 hover:border-croixrouge-500 hover:text-white transition">
                        + Ajouter une catégorie
                    </button>
                ` : ''}
            `;
        }

        selectLot(catId, lotId) {
            this.selectedCatId = catId;
            this.selectedLotId = lotId;
            this.currentView = 'lot';
            this.searchFilterText = '';
            this.render();
        }

        renderLotView() {
            const cat = this.data.categories.find(c => c.id === this.selectedCatId);
            const lot = cat ? cat.lots.find(l => l.id === this.selectedLotId) : null;
            if (!lot) return `<p>Lot introuvable.</p>`;

            return `
                <button onclick="app.switchView('home')" class="mb-4 text-xs text-gray-400 hover:text-white transition flex items-center space-x-1">
                    <span>← Retour aux catégories</span>
                </button>
                <div class="bg-gray-800 p-5 rounded-2xl border border-gray-700 mb-6">
                    <div class="flex justify-between items-center mb-4">
                        <div>
                            <span class="text-xs text-croixrouge-500 font-bold uppercase tracking-wider">${cat.name}</span>
                            <h2 class="text-xl font-bold text-white">${lot.name}</h2>
                        </div>
                        <div class="flex space-x-2 items-center">
                            <button onclick="app.openQrModal('${lot.id}', '${lot.name}')" class="px-3 py-1.5 bg-gray-700 hover:bg-gray-600 rounded-xl text-xs font-medium transition">QR Code</button>
                            ${this.isAdmin ? `<button onclick="app.deleteLot('${lot.id}')" class="px-3 py-1.5 bg-red-900/40 text-red-300 rounded-xl text-xs font-medium hover:bg-red-900/60 transition">Supprimer le lot</button>` : ''}
                            ${this.isAdmin ? `<button onclick="app.openAddArticleModal()" class="px-3 py-1.5 bg-croixrouge-600 text-white rounded-xl text-xs font-medium hover:bg-croixrouge-700 transition">+ Ajouter un article</button>` : ''}
                        </div>
                    </div>
                    <div class="relative">
                        <input type="text" oninput="app.handleInternalSearch(this.value)" value="${this.searchFilterText}" placeholder="Filtrer les articles de ce lot..." class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:ring-2 focus:ring-croixrouge-500">
                    </div>
                </div>
                <div class="space-y-3" id="articles-container">
                    ${this.getSortedAndFilteredArticlesHTML(lot)}
                </div>
            `;
        }

        renderArticles() {
            const container = document.getElementById('articles-container');
            if (!container) return;
            const cat = this.data.categories.find(c => c.id === this.selectedCatId);
            const lot = cat ? cat.lots.find(l => l.id === this.selectedLotId) : null;
            if (!lot) return;

            container.innerHTML = this.getSortedAndFilteredArticlesHTML(lot);
        }

        getSortedAndFilteredArticlesHTML(lot) {
            const articles = lot.articles || [];
            const todayStr = new Date().toISOString().split('T')[0];
            
            const twoMonthsLater = new Date();
            twoMonthsLater.setMonth(twoMonthsLater.getMonth() + 2);
            const twoMonthsStr = twoMonthsLater.toISOString().split('T')[0];

            const filtered = articles.filter(art => art.name.toLowerCase().includes(this.searchFilterText.toLowerCase()));

            filtered.sort((a, b) => {
                const aExp = a.expiryDate || '9999-12-31';
                const bExp = b.expiryDate || '9999-12-31';
                return aExp.localeCompare(bExp);
            });

            if (filtered.length === 0) {
                return `<p class="text-center text-gray-500 text-sm py-8">Aucun article trouvé dans ce lot.</p>`;
            }

            return filtered.map(art => {
                const isExpired = art.expiryDate && art.expiryDate < todayStr;
                const isSoon = art.expiryDate && !isExpired && art.expiryDate <= twoMonthsStr;

                let cardBorder = "border-gray-700 bg-gray-800";
                let badgeHtml = "";

                if (isExpired) {
                    cardBorder = "border-red-600/60 bg-red-950/20";
                    badgeHtml = `<span class="text-red-400 font-bold bg-red-900/40 px-2 py-0.5 rounded text-xs">Périmé (${art.expiryDate})</span>`;
                } else if (isSoon) {
                    cardBorder = "border-amber-600/60 bg-amber-950/20";
                    badgeHtml = `<span class="text-amber-400 font-bold bg-amber-900/40 px-2 py-0.5 rounded text-xs">Expire bientôt (${art.expiryDate})</span>`;
                }

                let inputStyle = "border-gray-700 text-white";
                if (isExpired) inputStyle = "border-red-500 text-red-300";
                else if (isSoon) inputStyle = "border-amber-500 text-amber-300";

                return `
                    <div class="p-4 rounded-xl border ${cardBorder} flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 transition">
                        <div class="space-y-1">
                            <div class="flex items-center space-x-2">
                                <h3 class="font-bold text-white text-sm">${art.name}</h3>
                                ${badgeHtml}
                            </div>
                            <div class="flex flex-wrap items-center space-x-3 text-xs text-gray-400 gap-y-1">
                                <span>Actuel : <strong class="text-white">${art.currentQty}</strong></span>
                                <span>Cible : <strong class="text-white">${art.targetQty}</strong></span>
                                <div class="flex items-center space-x-1">
                                    <span>Péremption :</span>
                                    <input type="date" value="${art.expiryDate || ''}" onchange="app.updateExpiry('${art.id}', this.value)" class="bg-gray-900 border ${inputStyle} rounded px-2 py-1 text-xs focus:outline-none focus:ring-1 focus:ring-croixrouge-500">
                                </div>
                            </div>
                        </div>
                        <div class="flex items-center space-x-2 w-full sm:w-auto justify-end">
                            <div class="flex items-center bg-gray-900 rounded-xl border border-gray-700 p-1 mr-2">
                                <button onclick="app.updateQty('${art.id}', -1)" class="w-7 h-7 flex items-center justify-center bg-gray-800 hover:bg-gray-700 rounded-lg text-sm font-bold text-white transition">-</button>
                                <span class="px-3 text-xs font-bold text-white">${art.currentQty}</span>
                                <button onclick="app.updateQty('${art.id}', 1)" class="w-7 h-7 flex items-center justify-center bg-gray-800 hover:bg-gray-700 rounded-lg text-sm font-bold text-white transition">+</button>
                            </div>
                            ${this.isAdmin ? `<button onclick="app.openEditArticleModal('${art.id}')" class="px-3 py-1.5 bg-gray-700 hover:bg-gray-600 rounded-lg text-xs font-medium transition">Modifier</button>` : ''}
                            ${this.isAdmin ? `<button onclick="app.deleteArticle('${art.id}')" class="px-3 py-1.5 bg-red-900/40 hover:bg-red-900/60 text-red-300 rounded-lg text-xs font-medium transition">Supprimer</button>` : ''}
                        </div>
                    </div>
                `;
            }).join('');
        }

        renderReapproView() {
            let itemsToAlert = [];
            const today = new Date().toISOString().split('T')[0];

            this.data.categories.forEach(cat => {
                if (cat.lots) {
                    cat.lots.forEach(lot => {
                        if (lot.articles) {
                            lot.articles.forEach(art => {
                                const isMissing = art.currentQty < art.targetQty;
                                const isExpired = art.expiryDate && art.expiryDate < today;

                                if (isMissing || isExpired) {
                                    itemsToAlert.push({
                                        catId: cat.id,
                                        catName: cat.name,
                                        lotId: lot.id,
                                        lotName: lot.name,
                                        art: art,
                                        missing: art.targetQty - art.currentQty,
                                        isMissing: isMissing,
                                        isExpired: isExpired
                                    });
                                }
                            });
                        }
                    });
                }
            });

            return `
                <button onclick="app.switchView('home')" class="mb-4 text-xs text-gray-400 hover:text-white transition flex items-center space-x-1">
                    <span>← Retour à l'accueil</span>
                </button>
                <div class="bg-gray-800 p-5 rounded-2xl border border-gray-700 mb-6">
                    <h2 class="text-xl font-bold text-white">Centre d'Alertes (Réappro & Péremptions)</h2>
                    <p class="text-xs text-gray-400">Articles nécessitant un réapprovisionnement ou dont la date de péremption est dépassée.</p>
                </div>
                <div class="space-y-3">
                    ${itemsToAlert.length === 0 ? `<p class="text-center text-gray-500 text-sm py-12">Tout est en ordre ! Aucun réapprovisionnement ni péremption.</p>` : itemsToAlert.map(item => `
                        <div class="bg-gray-800 p-4 rounded-xl border ${item.isExpired ? 'border-red-600/50 bg-red-950/20' : 'border-gray-700'} flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                            <div class="space-y-1">
                                <span class="text-xs text-croixrouge-500 font-bold uppercase tracking-wider">${item.catName} > ${item.lotName}</span>
                                <h3 class="font-bold text-white text-sm">${item.art.name}</h3>
                                <div class="flex flex-wrap items-center space-x-3 text-xs text-gray-400 gap-y-1">
                                    <span>Actuel : <strong class="text-white">${item.art.currentQty}</strong></span>
                                    <span>Cible : <strong class="text-white">${item.art.targetQty}</strong></span>
                                    ${item.isMissing ? `<span class="text-croixrouge-500 font-bold">Manque : ${item.missing}</span>` : ''}
                                    ${item.isExpired ? `<span class="text-red-400 font-bold bg-red-900/40 px-2 py-0.5 rounded">Périmé (${item.art.expiryDate})</span>` : ''}
                                </div>
                            </div>
                            <div class="flex items-center space-x-2 w-full sm:w-auto justify-end">
                                ${item.isExpired ? `
                                    <button onclick="app.openValidateExpiryModal('${item.art.id}')" class="px-3 py-1.5 bg-red-600 hover:bg-red-700 text-white rounded-xl text-xs font-medium transition shadow-sm">
                                        🔄 Remplacer (Péremption)
                                    </button>
                                ` : ''}
                                ${item.isMissing ? `
                                    <button onclick="app.openRestockModal('${item.art.id}')" class="px-3 py-1.5 bg-croixrouge-600 hover:bg-croixrouge-700 text-white rounded-xl text-xs font-medium transition shadow-sm">
                                        ➕ Réapprovisionner
                                    </button>
                                ` : ''}
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        openValidateExpiryModal(artId) {
            const art = this.findArticle(artId);
            if (!art) return;

            this.openModal(`
                <h3 class="text-xl font-bold mb-2 text-white">Validation de Péremption</h3>
                <p class="text-sm text-gray-300 mb-4">Article : <strong class="text-white">${art.name}</strong></p>
                <p class="text-xs text-gray-400 mb-4">Ancienne date dépassée : <span class="text-red-400 font-bold">${art.expiryDate || 'Aucune'}</span></p>
                <form onsubmit="app.saveValidateExpiry(event, '${artId}')" class="space-y-4">
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">Nouvelle date de péremption (Obligatoire)</label>
                        <input type="date" id="new-expiry-date" class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-2 text-white text-sm focus:outline-none focus:ring-2 focus:ring-croixrouge-500" required autofocus>
                    </div>
                    <div class="flex justify-end space-x-2 pt-2">
                        <button type="button" onclick="app.closeModal()" class="px-4 py-2 bg-gray-700 hover:bg-gray-600 rounded-xl text-sm font-medium">Annuler</button>
                        <button type="submit" class="px-4 py-2 bg-croixrouge-600 hover:bg-croixrouge-700 rounded-xl text-sm font-medium text-white">Valider le remplacement</button>
                    </div>
                </form>
            `);
        }

        saveValidateExpiry(event, artId) {
            event.preventDefault();
            const newDate = document.getElementById('new-expiry-date').value;
            if (!newDate) return;

            const art = this.findArticle(artId);
            if (!art) return;

            art.expiryDate = newDate;
            this.saveData();
            this.closeModal();
            this.render();
            this.showNotification("Date de péremption mise à jour avec succès !", "success");
        }

        openRestockModal(artId) {
            const art = this.findArticle(artId);
            if (!art) return;
            const missingQty = Math.max(0, art.targetQty - art.currentQty);

            this.openModal(`
                <h3 class="text-xl font-bold mb-2 text-white">Réapprovisionnement</h3>
                <p class="text-sm text-gray-300 mb-2">Article : <strong class="text-white">${art.name}</strong></p>
                <div class="bg-gray-900 p-3 rounded-xl mb-4 text-xs space-y-1 border border-gray-700">
                    <p class="text-gray-400">Stock actuel : <span class="text-white font-bold">${art.currentQty}</span> | Cible : <span class="text-white font-bold">${art.targetQty}</span></p>
                    <p class="text-croixrouge-500 font-bold">Quantité manquante conseillée : ${missingQty}</p>
                </div>
                <form onsubmit="app.saveRestock(event, '${artId}')" class="space-y-4">
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">Quantité ajoutée</label>
                        <input type="number" id="restock-qty-added" value="${missingQty}" min="1" class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-2 text-white text-sm focus:outline-none focus:ring-2 focus:ring-croixrouge-500" required autofocus>
                    </div>
                    <div class="flex justify-end space-x-2 pt-2">
                        <button type="button" onclick="app.closeModal()" class="px-4 py-2 bg-gray-700 hover:bg-gray-600 rounded-xl text-sm font-medium">Annuler</button>
                        <button type="submit" class="px-4 py-2 bg-croixrouge-600 hover:bg-croixrouge-700 rounded-xl text-sm font-medium text-white">Valider l'ajout</button>
                    </div>
                </form>
            `);
        }

        saveRestock(event, artId) {
            event.preventDefault();
            const addedQty = parseInt(document.getElementById('restock-qty-added').value) || 0;
            if (addedQty <= 0) return;

            const art = this.findArticle(artId);
            if (!art) return;

            art.currentQty += addedQty;
            this.saveData();
            this.closeModal();
            this.render();
            this.showNotification(`Stock mis à jour (+${addedQty}) avec succès !`, "success");
        }

        updateQty(artId, change) {
            const art = this.findArticle(artId);
            if (!art) return;
            art.currentQty = Math.max(0, art.currentQty + change);
            this.saveData();
            if (this.currentView === 'lot') this.renderArticles();
        }

        updateExpiry(artId, date) {
            const art = this.findArticle(artId);
            if (!art) return;
            art.expiryDate = date;
            this.saveData();
        }

        findArticle(artId) {
            for (let cat of this.data.categories) {
                if (cat.lots) {
                    for (let lot of cat.lots) {
                        if (lot.articles) {
                            let art = lot.articles.find(a => a.id === artId);
                            if (art) return art;
                        }
                    }
                }
            }
            return null;
        }

        handleGlobalSearch(query) {
            const dropdown = document.getElementById('global-search-dropdown');
            const q = query.toLowerCase().trim();
            if (!q) {
                dropdown.classList.add('hidden');
                dropdown.innerHTML = '';
                return;
            }

            let results = [];
            this.data.categories.forEach(cat => {
                if (cat.name.toLowerCase().includes(q)) {
                    results.push({ type: 'cat', catId: cat.id, title: cat.name, subtitle: 'Catégorie' });
                }
                if (cat.lots) {
                    cat.lots.forEach(lot => {
                        if (lot.name.toLowerCase().includes(q)) {
                            results.push({ type: 'lot', catId: cat.id, catName: cat.name, lotId: lot.id, title: lot.name, subtitle: `Lot dans ${cat.name}` });
                        }
                        if (lot.articles) {
                            lot.articles.forEach(art => {
                                if (art.name.toLowerCase().includes(q)) {
                                    results.push({ type: 'article', catId: cat.id, catName: cat.name, lotId: lot.id, lotName: lot.name, title: art.name, subtitle: `Article dans ${cat.name} > ${lot.name}` });
                                }
                            });
                        }
                    });
                }
            });

            if (results.length === 0) {
                dropdown.innerHTML = `<div class="p-4 text-center text-gray-400 text-sm">Aucun résultat trouvé.</div>`;
            } else {
                dropdown.innerHTML = results.slice(0, 5).map(res => `
                    <div onclick="app.jumpToResult('${res.catId}', '${res.lotId || ''}')" class="p-3.5 hover:bg-gray-700/50 cursor-pointer transition flex flex-col border-b border-gray-700/50 last:border-none">
                        <span class="font-semibold text-white text-sm">${res.title}</span>
                        <span class="text-xs text-gray-400">${res.subtitle}</span>
                    </div>
                `).join('');
            }
            dropdown.classList.remove('hidden');
        }

        jumpToResult(catId, lotId) {
            document.getElementById('global-search-dropdown').classList.add('hidden');
            document.getElementById('global-search-input').value = '';
            this.selectedCatId = catId;
            if (lotId) {
                this.selectedLotId = lotId;
                this.currentView = 'lot';
            } else {
                this.currentView = 'home';
            }
            this.render();
        }

        handleInternalSearch(value) {
            this.searchFilterText = value;
            this.renderArticles();
        }

        promptAdminLogin() {
            if (this.isAdmin) {
                this.isAdmin = false;
                this.showNotification("Mode Admin désactivé.", "info");
                this.render();
                return;
            }

            this.openModal(`
                <h3 class="text-xl font-bold mb-4 text-white">Connexion Administrateur</h3>
                <p class="text-sm text-gray-300 mb-4">Entrez le mot de passe administrateur (croixrouge10).</p>
                <form onsubmit="app.verifyAdminPassword(event)">
                    <input type="password" id="admin-pwd-input" placeholder="Mot de passe..." class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-2.5 text-white mb-4 text-sm focus:outline-none focus:ring-2 focus:ring-croixrouge-500" required autofocus>
                    <div class="flex justify-end space-x-2">
                        <button type="button" onclick="app.closeModal()" class="px-4 py-2 bg-gray-700 hover:bg-gray-600 rounded-xl text-sm font-medium">Annuler</button>
                        <button type="submit" class="px-4 py-2 bg-croixrouge-600 hover:bg-croixrouge-700 rounded-xl text-sm font-medium">Valider</button>
                    </div>
                </form>
            `);
        }

        verifyAdminPassword(event) {
            event.preventDefault();
            const pwd = document.getElementById('admin-pwd-input').value;
            if (pwd === "croixrouge10") {
                this.isAdmin = true;
                this.closeModal();
                this.showNotification("Mode Admin activé avec succès !", "success");
                this.render();
            } else {
                this.showNotification("Mot de passe incorrect.", "error");
            }
        }

        updateAdminUI() {
            const btn = document.getElementById('admin-toggle-btn');
            const toolsFooter = document.getElementById('admin-tools-footer');
            const dot = document.getElementById('connection-status-dot');
            const statusText = document.getElementById('connection-status-text');
            const toggleBtn = document.getElementById('toggle-cloud-btn');

            if (btn) {
                if (this.isAdmin) {
                    btn.innerHTML = `<span>🔓 Admin (Actif)</span>`;
                    btn.classList.add('bg-croixrouge-600', 'text-white');
                    btn.classList.remove('bg-gray-700', 'text-gray-200');
                } else {
                    btn.innerHTML = `<span>🔒 Admin</span>`;
                    btn.classList.remove('bg-croixrouge-600', 'text-white');
                    btn.classList.add('bg-gray-700', 'text-gray-200');
                }
            }

            if (toolsFooter) {
                if (this.isAdmin) {
                    toolsFooter.classList.remove('hidden');
                } else {
                    toolsFooter.classList.add('hidden');
                }
            }

            if (dot && statusText && toggleBtn) {
                if (this.isCloudConnected) {
                    dot.className = "w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse";
                    statusText.innerText = "Mode Connecté (Cloud actif)";
                    toggleBtn.innerText = "🔌 Se déconnecter (Mode Local)";
                    toggleBtn.className = "px-3 py-1.5 bg-amber-600 hover:bg-amber-700 text-white text-xs rounded-xl transition font-medium";
                } else {
                    dot.className = "w-2.5 h-2.5 rounded-full bg-gray-500";
                    statusText.innerText = "Mode Local (Déconnecté)";
                    toggleBtn.innerText = "☁️ Se reconnecter & Synchro";
                    toggleBtn.className = "px-3 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white text-xs rounded-xl transition font-medium";
                }
            }
        }

        openQrModal(lotId, lotName) {
            const targetUrl = window.location.href.split('?')[0] + "?lot=" + lotId;
            this.openModal(`
                <div class="text-center">
                    <h3 class="text-xl font-bold mb-4 text-white">QR Code : ${lotName}</h3>
                    <div id="qrcode-container" class="flex justify-center bg-white p-4 rounded-xl mb-4 inline-block">
                        <div id="qrcode"></div>
                    </div>
                    <p class="text-xs text-gray-400 mb-4">Scannez ou téléchargez pour coller sur le lot / véhicule.</p>
                    <div class="flex justify-center space-x-2">
                        <button onclick="app.downloadQRCode('${lotName}')" class="px-4 py-2 bg-croixrouge-600 hover:bg-croixrouge-700 rounded-xl text-sm font-medium text-white transition">📥 Télécharger PNG</button>
                        <button onclick="app.closeModal()" class="px-4 py-2 bg-gray-700 hover:bg-gray-600 rounded-xl text-sm font-medium">Fermer</button>
                    </div>
                </div>
            `);
            new QRCode(document.getElementById("qrcode"), {
                text: targetUrl,
                width: 160,
                height: 160
            });
        }

        downloadQRCode(lotName) {
            const img = document.querySelector('#qrcode img') || document.querySelector('#qrcode canvas');
            if (!img) return;
            let imageUrl = "";
            if (img.tagName === 'CANVAS') {
                imageUrl = img.toDataURL("image/png");
            } else {
                imageUrl = img.src;
            }
            const downloadLink = document.createElement('a');
            downloadLink.href = imageUrl;
            downloadLink.download = `QRCode_${lotName.replace(/[^a-zA-Z0-9]/g, '_')}.png`;
            document.body.appendChild(downloadLink);
            downloadLink.click();
            downloadLink.remove();
            this.showNotification("QR Code téléchargé avec succès !", "success");
        }

        openAddCategoryModal() {
            this.openModal(`
                <h3 class="text-xl font-bold mb-4 text-white">Ajouter une Nouvelle Catégorie</h3>
                <form onsubmit="app.saveNewCategory(event)">
                    <input type="text" id="new-cat-name" placeholder="Nom de la catégorie..." class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-2.5 text-white mb-4 text-sm focus:outline-none focus:ring-2 focus:ring-croixrouge-500" required autofocus>
                    <div class="flex justify-end space-x-2">
                        <button type="button" onclick="app.closeModal()" class="px-4 py-2 bg-gray-700 hover:bg-gray-600 rounded-xl text-sm font-medium">Annuler</button>
                        <button type="submit" class="px-4 py-2 bg-croixrouge-600 hover:bg-croixrouge-700 rounded-xl text-sm font-medium">Créer</button>
                    </div>
                </form>
            `);
        }

        saveNewCategory(event) {
            event.preventDefault();
            const name = document.getElementById('new-cat-name').value.trim();
            if (!name) return;

            const newId = 'cat_' + Date.now();
            this.data.categories.push({ id: newId, name: name, lots: [] });
            this.saveData();
            this.closeModal();
            this.render();
            this.showNotification("Catégorie créée avec succès !", "success");
        }

        deleteCategory(catId) {
            if (!this.isAdmin) return;
            if (confirm("Voulez-vous vraiment supprimer cette catégorie et tout son contenu ?")) {
                this.data.categories = this.data.categories.filter(c => c.id !== catId);
                this.saveData();
                this.render();
                this.showNotification("Catégorie supprimée.", "info");
            }
        }

        openAddLotModal() {
            this.openModal(`
                <h3 class="text-xl font-bold mb-4 text-white">Ajouter un Nouveau Lot</h3>
                <form onsubmit="app.saveNewLot(event)">
                    <input type="text" id="new-lot-name" placeholder="Nom du lot..." class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-2.5 text-white mb-4 text-sm focus:outline-none focus:ring-2 focus:ring-croixrouge-500" required autofocus>
                    <div class="flex justify-end space-x-2">
                        <button type="button" onclick="app.closeModal()" class="px-4 py-2 bg-gray-700 hover:bg-gray-600 rounded-xl text-sm font-medium">Annuler</button>
                        <button type="submit" class="px-4 py-2 bg-croixrouge-600 hover:bg-croixrouge-700 rounded-xl text-sm font-medium">Créer le lot</button>
                    </div>
                </form>
            `);
        }

        saveNewLot(event) {
            event.preventDefault();
            const name = document.getElementById('new-lot-name').value.trim();
            if (!name) return;

            const cat = this.data.categories.find(c => c.id === this.selectedCatId);
            if (!cat) return;

            if (!cat.lots) cat.lots = [];
            cat.lots.push({ id: 'lot_' + Date.now(), name: name, articles: [] });
            this.saveData();
            this.closeModal();
            this.render();
            this.showNotification("Lot créé avec succès !", "success");
        }

        deleteLot(lotId) {
            if (!this.isAdmin) return;
            if (confirm("Voulez-vous vraiment supprimer ce lot ?")) {
                const cat = this.data.categories.find(c => c.id === this.selectedCatId);
                if (cat) {
                    cat.lots = cat.lots.filter(l => l.id !== lotId);
                    this.saveData();
                    this.render();
                    this.showNotification("Lot supprimé.", "info");
                }
            }
        }

        openAddArticleModal() {
            this.openModal(`
                <h3 class="text-xl font-bold mb-4 text-white">Ajouter un Article</h3>
                <form onsubmit="app.saveNewArticle(event)" class="space-y-4">
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">Nom de l'article</label>
                        <input type="text" id="art-name" placeholder="ex: Compresse stérile" class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-2 text-white text-sm focus:outline-none focus:ring-2 focus:ring-croixrouge-500" required autofocus>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs text-gray-400 mb-1">Stock Actuel</label>
                            <input type="number" id="art-current" value="10" min="0" class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-2 text-white text-sm focus:outline-none focus:ring-2 focus:ring-croixrouge-500" required>
                        </div>
                        <div>
                            <label class="block text-xs text-gray-400 mb-1">Stock Théorique</label>
                            <input type="number" id="art-target" value="10" min="0" class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-2 text-white text-sm focus:outline-none focus:ring-2 focus:ring-croixrouge-500" required>
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">Date de péremption (Optionnel)</label>
                        <input type="date" id="art-expiry" class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-2 text-white text-sm focus:outline-none focus:ring-2 focus:ring-croixrouge-500">
                    </div>
                    <div class="flex justify-end space-x-2 pt-2">
                        <button type="button" onclick="app.closeModal()" class="px-4 py-2 bg-gray-700 hover:bg-gray-600 rounded-xl text-sm font-medium">Annuler</button>
                        <button type="submit" class="px-4 py-2 bg-croixrouge-600 hover:bg-croixrouge-700 rounded-xl text-sm font-medium">Ajouter</button>
                    </div>
                </form>
            `);
        }

        saveNewArticle(event) {
            event.preventDefault();
            const name = document.getElementById('art-name').value.trim();
            const currentQty = parseInt(document.getElementById('art-current').value) || 0;
            const targetQty = parseInt(document.getElementById('art-target').value) || 0;
            const expiryDate = document.getElementById('art-expiry').value;

            const cat = this.data.categories.find(c => c.id === this.selectedCatId);
            const lot = cat ? cat.lots.find(l => l.id === this.selectedLotId) : null;
            if (!lot) return;

            if (!lot.articles) lot.articles = [];
            lot.articles.push({
                id: 'art_' + Date.now(),
                name: name,
                currentQty: currentQty,
                targetQty: targetQty,
                expiryDate: expiryDate
            });

            this.saveData();
            this.closeModal();
            this.renderArticles();
            this.showNotification("Article ajouté avec succès !", "success");
        }

        openEditArticleModal(artId) {
            const cat = this.data.categories.find(c => c.id === this.selectedCatId);
            const lot = cat ? cat.lots.find(l => l.id === this.selectedLotId) : null;
            const art = lot ? lot.articles.find(a => a.id === artId) : null;
            if (!art) return;

            this.openModal(`
                <h3 class="text-xl font-bold mb-4 text-white">Modifier l'Article</h3>
                <form onsubmit="app.saveEditArticle(event, '${artId}')" class="space-y-4">
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">Nom de l'article</label>
                        <input type="text" id="edit-art-name" value="${art.name}" class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-2 text-white text-sm focus:outline-none focus:ring-2 focus:ring-croixrouge-500" required autofocus>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs text-gray-400 mb-1">Stock Actuel</label>
                            <input type="number" id="edit-art-current" value="${art.currentQty}" min="0" class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-2 text-white text-sm focus:outline-none focus:ring-2 focus:ring-croixrouge-500" required>
                        </div>
                        <div>
                            <label class="block text-xs text-gray-400 mb-1">Stock Théorique</label>
                            <input type="number" id="edit-art-target" value="${art.targetQty}" min="0" class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-2 text-white text-sm focus:outline-none focus:ring-2 focus:ring-croixrouge-500" required>
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">Date de péremption</label>
                        <input type="date" id="edit-art-expiry" value="${art.expiryDate || ''}" class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-2 text-white text-sm focus:outline-none focus:ring-2 focus:ring-croixrouge-500">
                    </div>
                    <div class="flex justify-end space-x-2 pt-2">
                        <button type="button" onclick="app.closeModal()" class="px-4 py-2 bg-gray-700 hover:bg-gray-600 rounded-xl text-sm font-medium">Annuler</button>
                        <button type="submit" class="px-4 py-2 bg-croixrouge-600 hover:bg-croixrouge-700 rounded-xl text-sm font-medium">Enregistrer</button>
                    </div>
                </form>
            `);
        }

        saveEditArticle(event, artId) {
            event.preventDefault();
            const cat = this.data.categories.find(c => c.id === this.selectedCatId);
            const lot = cat ? cat.lots.find(l => l.id === this.selectedLotId) : null;
            const art = lot ? lot.articles.find(a => a.id === artId) : null;
            if (!art) return;

            art.name = document.getElementById('edit-art-name').value.trim();
            art.currentQty = parseInt(document.getElementById('edit-art-current').value) || 0;
            art.targetQty = parseInt(document.getElementById('edit-art-target').value) || 0;
            art.expiryDate = document.getElementById('edit-art-expiry').value;

            this.saveData();
            this.closeModal();
            this.renderArticles();
            this.showNotification("Article modifié avec succès !", "success");
        }

        deleteArticle(artId) {
            if (!this.isAdmin) return;
            if (confirm("Voulez-vous vraiment supprimer cet article ?")) {
                const cat = this.data.categories.find(c => c.id === this.selectedCatId);
                const lot = cat ? cat.lots.find(l => l.id === this.selectedLotId) : null;
                if (lot) {
                    lot.articles = lot.articles.filter(a => a.id !== artId);
                    this.saveData();
                    this.renderArticles();
                    this.showNotification("Article supprimé.", "info");
                }
            }
        }

        exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(this.data, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", "croix_rouge_inventaire_backup.json");
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
            this.showNotification("Sauvegarde JSON exportée avec succès !", "success");
        }

        openModal(htmlContent) {
            const container = document.getElementById('modal-container');
            const box = document.getElementById('modal-box');
            box.innerHTML = htmlContent;
            container.classList.remove('hidden');
        }

        closeModal() {
            document.getElementById('modal-container').classList.add('hidden');
        }

        showNotification(message, type = 'success') {
            const banner = document.getElementById('notification-banner');
            if (!banner) return;
            banner.innerText = message;
            banner.className = `mb-6 p-4 rounded-xl text-sm font-medium shadow-sm transition ${
                type === 'success' ? 'bg-emerald-900/50 text-emerald-300 border border-emerald-700/50' :
                type === 'error' ? 'bg-red-900/50 text-red-300 border border-red-700/50' :
                'bg-indigo-900/50 text-indigo-300 border border-indigo-700/50'
            }`;
            banner.classList.remove('hidden');
            setTimeout(() => {
                banner.classList.add('hidden');
            }, 3500);
        }
    }

    const app = new LogisticsApp();
    </script>
</body>
</html>
