<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logistique - Croix-Rouge (MAT)</title>
    <style>
        :root {
            --cr-red: #cc0000;
            --cr-dark-bg: #121212;
            --cr-panel-bg: #1e1e1e;
            --cr-border: #333333;
            --cr-text: #e0e0e0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--cr-dark-bg); color: var(--cr-text); padding: 20px; }

        .panel { background: var(--cr-panel-bg); border: 1px solid var(--cr-border); border-radius: 8px; padding: 20px; margin-bottom: 20px; }
        header { border-bottom: 3px solid var(--cr-red); padding-bottom: 10px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        header h1 { color: #fff; font-size: 1.5rem; }

        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid var(--cr-border); font-size: 0.9rem; }
        th { background: #181818; color: #aaa; text-transform: uppercase; font-size: 0.75rem; }

        .btn { padding: 8px 16px; background-color: var(--cr-red); color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-small { padding: 5px 10px; font-size: 0.8rem; }
        .btn-secondary { background: #333; color: #ccc; }

        .badge { padding: 4px 8px; border-radius: 12px; font-size: 0.75rem; font-weight: bold; }
        .badge-ok { background: #1b5e20; color: #81c784; }
        .badge-warn { background: #e65100; color: #ffcc80; }
        .badge-alert { background: #b71c1c; color: #ef9a9a; }
        .badge-secondary { background: #2a2a2a; color: #888; }
        
        .form-inline { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
        input { padding: 8px; background: #121212; border: 1px solid var(--cr-border); color: #fff; border-radius: 4px; flex: 1; min-width: 200px; }
    </style>
</head>
<body>

<header>
    <h1>Gestion Logistique (MAT)</h1>
    <div style="font-size: 0.8rem; color: #4caf50;">✔ Prêt pour GitHub & Utilisation Terrain</div>
</header>

<div class="panel">
    <h3>Ajouter un Lot / Conteneur</h3>
    <div class="form-inline">
        <input type="text" id="new-lot-name" placeholder="Nom du lot ou conteneur (ex: Lot Pansement)">
        <button class="btn" onclick="addNewLot()">+ Créer le lot</button>
    </div>
</div>

<div class="panel">
    <h3>Conteneurs & Lots enregistrés</h3>
    <table id="containers-table">
        <thead>
            <tr>
                <th>Nom du Lot</th>
                <th>Péremption</th>
                <th>Validation Physique</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="containers-body"></tbody>
    </table>
</div>

<div id="items-panel" class="panel" style="display: none;">
    <h3 id="items-title">Articles dans le lot</h3>
    <div class="form-inline">
        <input type="text" id="item-name" placeholder="Nom de l'article">
        <input type="date" id="item-expiry">
        <button class="btn" onclick="addItemToCurrentLot()">Ajouter Article</button>
    </div>
    <table id="items-table">
        <thead>
            <tr>
                <th>Article</th>
                <th>Date Péremption</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="items-body"></tbody>
    </table>
    <button class="btn btn-secondary" onclick="closeItems()" style="margin-top: 15px;">Fermer la gestion du lot</button>
</div>

<script>
    let data = JSON.parse(localStorage.getItem('cr_data_github') || '[]');
    let currentContainerId = null;

    function saveToStorage() {
        localStorage.setItem('cr_data_github', JSON.stringify(data));
        renderContainers();
    }

    function getLotStatus(items) {
        if (!items || items.length === 0) return { class: 'badge-secondary', text: 'Vide' };
        const now = new Date();
        let worst = 0; 
        items.forEach(i => {
            const exp = new Date(i.expiry);
            const diff = (exp - now) / (1000 * 60 * 60 * 24);
            if (diff < 0) worst = 2;
            else if (diff < 90 && worst < 1) worst = 1;
        });
        if (worst === 2) return { class: 'badge-alert', text: 'Périmé !' };
        if (worst === 1) return { class: 'badge-warn', text: 'À surveiller' };
        return { class: 'badge-ok', text: 'Conforme' };
    }

    function renderContainers() {
        const tbody = document.getElementById('containers-body');
        if (!tbody) return;

        if (data.length === 0) {
            tbody.innerHTML = `<tr><td colspan="4" style="text-align:center; color:#888;">Aucun lot pour l'instant. Utilisez le formulaire ci-dessus.</td></tr>`;
            return;
        }

        tbody.innerHTML = data.map(c => {
            const status = getLotStatus(c.items);
            return `<tr>
                <td><strong>${c.name}</strong></td>
                <td><span class="badge ${status.class}">${status.text}</span></td>
                <td>
                    ${c.lastChecked ? '✅ ' + c.lastChecked : '❌ Non vérifié'}
                    <button class="btn btn-small btn-secondary" style="margin-left:10px;" onclick="toggleCheck(${c.id})">${c.lastChecked ? 'Dévalider' : 'Valider'}</button>
                </td>
                <td>
                    <button class="btn btn-small" onclick="viewItems(${c.id})">Gérer articles</button>
                    <button class="btn btn-small" style="background:#800;" onclick="deleteLot(${c.id})">Suppr</button>
                </td>
            </tr>`;
        }).join('');
    }

    function addNewLot() {
        const input = document.getElementById('new-lot-name');
        const name = input.value.trim();
        if (!name) {
            alert("Veuillez entrer un nom de lot.");
            return;
        }
        data.push({ id: Date.now(), name, items: [], lastChecked: null });
        input.value = '';
        saveToStorage();
    }

    function toggleCheck(id) {
        const c = data.find(x => x.id === id);
        if (c) {
            c.lastChecked = c.lastChecked ? null : new Date().toLocaleDateString('fr-FR') + ' ' + new Date().toLocaleTimeString('fr-FR', {hour: '2-digit', minute:'2-digit'});
            saveToStorage();
        }
    }

    function deleteLot(id) {
        if (confirm("Voulez-vous vraiment supprimer ce lot ?")) {
            data = data.filter(x => x.id !== id);
            saveToStorage();
            if (currentContainerId === id) closeItems();
        }
    }

    function viewItems(id) {
        currentContainerId = id;
        const c = data.find(x => x.id === id);
        document.getElementById('items-panel').style.display = 'block';
        document.getElementById('items-title').textContent = "Articles du lot : " + c.name;
        renderItems();
        document.getElementById('items-panel').scrollIntoView({ behavior: 'smooth' });
    }

    function renderItems() {
        const c = data.find(x => x.id === currentContainerId);
        const tbody = document.getElementById('items-body');
        if (!c || !c.items || c.items.length === 0) {
            tbody.innerHTML = `<tr><td colspan="3" style="text-align:center; color:#888;">Aucun article dans ce lot.</td></tr>`;
            return;
        }
        tbody.innerHTML = c.items.map((i, idx) => `<tr>
            <td>${i.name}</td>
            <td>${i.expiry}</td>
            <td><button class="btn btn-small" style="background:#800;" onclick="deleteItem(${idx})">X</button></td>
        </tr>`).join('');
    }

    function addItemToCurrentLot() {
        const nameInput = document.getElementById('item-name');
        const expiryInput = document.getElementById('item-expiry');
        const name = nameInput.value.trim();
        const expiry = expiryInput.value;

        if (!name || !expiry) {
            alert("Veuillez remplir le nom et la date de péremption.");
            return;
        }

        const c = data.find(x => x.id === currentContainerId);
        if (c) {
            if (!c.items) c.items = [];
            c.items.push({ name, expiry });
            nameInput.value = '';
            expiryInput.value = '';
            saveToStorage();
            renderItems();
        }
    }

    function deleteItem(idx) {
        const c = data.find(x => x.id === currentContainerId);
        if (c && c.items) {
            c.items.splice(idx, 1);
            saveToStorage();
            renderItems();
        }
    }

    function closeItems() {
        currentContainerId = null;
        document.getElementById('items-panel').style.display = 'none';
    }

    window.onload = renderContainers;
</script>
</body>
</html>
